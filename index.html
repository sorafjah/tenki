<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ===================== 設定（ここの数値だけ直せば調整できます） ===================== */
const CFG = {
  version: 'v2026-11-10d',
  groundTemp: 25,              // 地上の気温（℃）
  dryLapse: 1.0,               // 雲ができるまで：100mで何℃下がるか
  wetLapse: 0.5,               // 雲ができてから：100mで何℃下がるか
  humidity: 55,                // 地上の湿度（%）
  mountain: 2000,              // 山の高さ（m）
  rainDepth: 600,              // 雲ができた高さから何m上がると雨になるか
  duration: 34,                // 自動で最初から最後まで進む秒数
  stepSpeed: 1.7,              // 「次へ」で進むときの速さ（自動の何倍か）
  parcelR0: 2.6,               // 空気のかたまりの最初の大きさ
  parcelGrow: 0.5,             // 1000m上がるごとに大きさが何割ふえるか（実際より大げさ）
  rainDrops: 160,
  sound: true,
};
/* 飽和水蒸気量（g/m³）— 教科書の表の値 */
const SAT_TABLE = [[-20,1.1],[-15,1.6],[-10,2.4],[-5,3.4],[0,4.8],[5,6.8],[10,9.4],[15,12.8],[20,17.3],[25,23.1],[30,30.4],[35,39.6]];

/* ===================== 物理（教科書モデル） ===================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
function sat(T){T=clamp(T,-20,35);for(let i=0;i<SAT_TABLE.length-1;i++){const[a,va]=SAT_TABLE[i],[b,vb]=SAT_TABLE[i+1];if(T<=b)return va+(vb-va)*(T-a)/(b-a);}return 39.6;}
function dewOf(v){for(let i=0;i<SAT_TABLE.length-1;i++){const[a,va]=SAT_TABLE[i],[b,vb]=SAT_TABLE[i+1];if(v<=vb)return a+(b-a)*(v-va)/(vb-va);}return 35;}
function seeded(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

/* ===================== 状態 ===================== */
const S = {
  p: 0, mode: 'idle', targetP: 0,
  humidity: CFG.humidity, mountain: CFG.mountain,
  vapor: 0, dew: 0, base: 0,
  x: 0, h: 0, T: 0, rh: 0, cond: 0, cloudAmt: 0, rainAmt: 0, stage: 0,
  paused: true, started: false, mute: false, frames: 0, elapsed: 0,
};

/* ===================== 地形と経路（奥行きは以前の半分。山の向こう側の奥は、くぼみで切ってある） ===================== */
const XS=-37, XP=8, WL=30, WR=24, ZP=2;           // 出発x, 山頂x, 山の左右の幅（進む向き）, 空気のかたまりのz
const XF=XP-WL;                                   // ふもと
const PA=0.12;                                    // 経路の区切り（海の上→山をのぼる。山頂がゴール）
const TX0=-46, TX1=38, TZ0=-14, TZ1=8;            // 地形の範囲（奥行きは 22 ＝ 以前の半分）
function prof(x){const d=x<XP?(XP-x)/WL:(x-XP)/WR;return d>=1?0:0.5*(1+Math.cos(Math.PI*d));}
function terrainH(x,z){ // ワールド単位（1 = 100m）。奥の端（TZ0）に向かってなだらかに低くなる
  const back=smooth(TZ0,TZ0+5,z);
  return Math.max(0,S.mountain/100*prof(x)*back);
}
function pathAt(p){ // 進みぐあい p(0〜1) → x と 高さh(m)。p=1 が山頂
  if(p<PA) return {x:lerp(XS,XF,p/PA),h:0};
  const x=lerp(XF,XP,(p-PA)/(1-PA));
  return {x,h:S.mountain*prof(x)};
}
function pForH(h){let a=0,b=1;for(let i=0;i<30;i++){const m=(a+b)/2;if(pathAt(m).h>=h)b=m;else a=m;}return b;}
const topH=()=>S.mountain;

function recalcAir(){
  S.vapor=sat(CFG.groundTemp)*S.humidity/100;
  S.dew=dewOf(S.vapor);
  S.base=(CFG.groundTemp-S.dew)*100/CFG.dryLapse;
}
function derive(){
  const pt=pathAt(S.p); S.x=pt.x; S.h=pt.h;
  S.T = S.h<=S.base ? CFG.groundTemp-S.h/100*CFG.dryLapse : S.dew-(S.h-S.base)/100*CFG.wetLapse;
  const sv=sat(S.T);
  S.rh=Math.min(100,S.vapor/sv*100);
  S.cond=Math.max(0,S.vapor-sv);
  S.cloudAmt=S.h>=S.base?smooth(0,400,S.h-S.base+40):0;
  S.rainAmt=clamp((S.h-S.base-CFG.rainDepth)/300,0,1);
  let st;
  if(S.h>=S.base+CFG.rainDepth) st=3; else if(S.h>=S.base) st=2; else if(S.p>=0.999) st=4; else if(S.h>1) st=1; else st=0;
  S.stage=st;
}
function stepTargets(){
  const top=topH(), hs=[0.55*Math.min(S.base,top), S.base+150, S.base+CFG.rainDepth+250];
  const t=hs.filter(h=>h<=top).map(pForH);
  if(!t.length||t[t.length-1]<0.995) t.push(1);
  return t;
}

/* ===================== Three.js 準備 ===================== */
const $=id=>document.getElementById(id);
const stageEl=$('stage'), capEl=$('caption');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.domElement.id='gl';
stageEl.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,1,600);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enablePan=false; controls.enableDamping=true; controls.dampingFactor=0.12;
controls.minPolarAngle=THREE.MathUtils.degToRad(58); controls.maxPolarAngle=THREE.MathUtils.degToRad(88);
controls.minAzimuthAngle=-0.6; controls.maxAzimuthAngle=0.6;
/* 画面いっぱいに空を描き、右のパネルは空の上に重ねる（右の山のふもとは低いのでパネルと重ならない）。景色は説明文（上）をよけて、できるだけ大きく置く */
const VIEW={cx:-4,w:88,top:37,bottom:-4.5,botPad:36};   // 景色の中心x・横幅・上端・下端（ワールド単位）と、下の余白(px)
function fitView(){
  const w=stageEl.clientWidth||800,h=stageEl.clientHeight||600;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  const fs=parseFloat(getComputedStyle(capEl).fontSize)||24;
  const capH=(w<900?2:1)*1.8*fs+20+10+8;           // 説明文の高さ（ふつうは1行ぶん）＋すきま
  const avail=h-capH-VIEW.botPad, units=VIEW.top-VIEW.bottom;
  const ppu=Math.min((w-16)/VIEW.w,avail/units);   // 1ワールド単位が何pxか
  const extra=Math.max(0,avail-units*ppu);          // 縦にあまった分は上下半分ずつ（景色を少し上へ）
  const t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const d=h/(2*t*ppu);
  const ty=VIEW.bottom+h/(2*ppu)-(VIEW.botPad+extra/2)/ppu, tx=VIEW.cx;
  const a=THREE.MathUtils.degToRad(8);
  camera.position.set(tx,ty+d*Math.sin(a),d*Math.cos(a));
  controls.target.set(tx,ty,0);
  controls.minDistance=d*0.5; controls.maxDistance=d*1.15; controls.update();
}

 gr.addColorStop(0,'#4aa0ea');gr.addColorStop(.6,'#aedbff');gr.addColorStop(1,'#e4f4ff');g.fillStyle=gr;g.fillRect(0,0,8,256);

scene.add(new THREE.HemisphereLight(0xffffff,0x8fae8f,1.25));
const sunL=new THREE.DirectionalLight(0xffffff,1.7);sunL.position.set(-30,50,40);scene.add(sunL);
{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const gr=g.createRadialGradient(64,64,6,64,64,64);
 gr.addColorStop(0,'rgba(255,255,230,1)');gr.addColorStop(.35,'rgba(255,236,150,.95)');gr.addColorStop(1,'rgba(255,236,150,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));sp.scale.set(14,14,1);sp.position.set(-30,32,-34);scene.add(sp);}

// 地形
const NX=168,NZ=44;
const terrGeo=new THREE.BufferGeometry();
{const pos=new Float32Array((NX+1)*(NZ+1)*3),col=new Float32Array((NX+1)*(NZ+1)*3),idx=[];
 for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){const a=j*(NX+1)+i,b=a+1,c=a+NX+1,d=c+1;idx.push(a,c,b,b,c,d);}
 terrGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));terrGeo.setAttribute('color',new THREE.BufferAttribute(col,3));terrGeo.setIndex(idx);}

 frontGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));frontGeo.setIndex(idx);}
scene.add(new THREE.Mesh(frontGeo,new THREE.MeshBasicMaterial({color:0xb48a58,side:THREE.DoubleSide})));
{const W=TX1-TX0,D=TZ1-TZ0;
 const base=new THREE.Mesh(new THREE.BoxGeometry(W+0.1,4,D+0.1),new THREE.MeshLambertMaterial({color:0xa27b4e}));base.position.set((TX0+TX1)/2,-2.03,(TZ0+TZ1)/2);scene.add(base);
 const sea=new THREE.Mesh(new THREE.BoxGeometry(14.1,4.2,D+0.3),new THREE.MeshLambertMaterial({color:0x3f8fd8}));sea.position.set(-39,-1.96,(TZ0+TZ1)/2+0.1);scene.add(sea);}
const cGrass=new THREE.Color(0x86cc6c),cSand=new THREE.Color(0xe9dba2),cForest=new THREE.Color(0x4f9a55),cRock=new THREE.Color(0x9c907c),cSnow=new THREE.Color(0xffffff),cTmp=new THREE.Color();
const TREES=80, trees=new THREE.InstancedMesh(new THREE.ConeGeometry(0.55,1.5,6),new THREE.MeshLambertMaterial({color:0x2f7d46,flatShading:true}),TREES);scene.add(trees);
const treeXZ=[];{const r=seeded(7);for(let i=0;i<TREES;i++){let x,z;do{x=-29+r()*65;z=-13+r()*20;}while(z>-1.5&&z<5.5);treeXZ.push([x,z,0.7+r()*0.7]);}}
const M4=new THREE.Matrix4(),Q0=new THREE.Quaternion(),V3=new THREE.Vector3(),SC=new THREE.Vector3();
function rebuildTerrain(){
  const pos=terrGeo.attributes.position,col=terrGeo.attributes.color;
  for(let j=0;j<=NZ;j++)for(let i=0;i<=NX;i++){
    const k=j*(NX+1)+i,x=lerp(TX0,TX1,i/NX),z=lerp(TZ0,TZ1,j/NZ),h=terrainH(x,z);
    pos.setXYZ(k,x,h,z);
    if(x<-30.5)cTmp.copy(cSand);else if(h<12)cTmp.copy(cGrass).lerp(cForest,h/12);else if(h<23)cTmp.copy(cForest).lerp(cRock,smooth(12,18,h));else cTmp.copy(cRock).lerp(cSnow,smooth(23,25.5,h));
    col.setXYZ(k,cTmp.r,cTmp.g,cTmp.b);
  }
  pos.needsUpdate=true;col.needsUpdate=true;terrGeo.computeVertexNormals();
  const fp=frontGeo.attributes.position;
  for(let i=0;i<=NX;i++){const x=lerp(TX0,TX1,i/NX);fp.setXYZ(i*2,x,terrainH(x,TZ1),TZ1);fp.setXYZ(i*2+1,x,-0.03,TZ1);}
  fp.needsUpdate=true;frontGeo.computeBoundingSphere();terrGeo.computeBoundingSphere();
  treeXZ.forEach(([x,z,s],i)=>{const h=terrainH(x,z);const sc=(h<15&&x>-30)?s:0.0001;M4.compose(V3.set(x,h+0.75*sc,z),Q0,SC.set(sc,sc,sc));trees.setMatrixAt(i,M4);});
  trees.instanceMatrix.needsUpdate=true;
}

// 文字ラベル（ふりがな付き）
function makeLabel(segs,o={}){
  const fs=56,rf=26,pad=18,font=`700 ${fs}px "BIZ UDPGothic","Hiragino Sans",sans-serif`,rfont=`400 ${rf}px "BIZ UDPGothic","Hiragino Sans",sans-serif`;
  const c=document.createElement('canvas'),g=c.getContext('2d');g.font=font;
  const ws=segs.map(s=>g.measureText(s[0]).width),W=ws.reduce((a,b)=>a+b,0)+pad*2,hasR=segs.some(s=>s[1]),H=fs+(hasR?rf+6:0)+pad*1.4;
  c.width=Math.ceil(W);c.height=Math.ceil(H);
  g.fillStyle=o.bg||'rgba(255,255,255,.92)';g.strokeStyle='#1c2b3a';g.lineWidth=5;
  g.beginPath();g.roundRect(3,3,c.width-6,c.height-6,18);g.fill();g.stroke();
  let x=pad;g.textBaseline='alphabetic';g.fillStyle=o.color||'#1c2b3a';
  segs.forEach((s,i)=>{g.font=font;g.textAlign='left';g.fillText(s[0],x,c.height-pad*0.9);if(s[1]){g.font=rfont;g.textAlign='center';g.fillText(s[1],x+ws[i]/2,pad*0.5+rf);}x+=ws[i];});
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  const hh=o.h||2.8;sp.scale.set(hh*c.width/c.height,hh,1);sp.renderOrder=20;return sp;
}
let airLabel=null,cloudLabel=null;
function buildLabels(){
  const sea=makeLabel([['海','うみ']]);sea.position.set(-43.6,1.4,7.5);scene.add(sea);
  const wind=makeLabel([['風','かぜ']],{color:'#0b63b8'});wind.position.set(-41.5,19.2,5);scene.add(wind);
  airLabel=makeLabel([['空気','くうき'],['のかたまり','']]);scene.add(airLabel);
  cloudLabel=makeLabel([['雲','くも']],{bg:'rgba(227,241,255,.96)'});scene.add(cloudLabel);
}

/* ===== 空気のかたまり：うすく透明な水色の塊 → その同じ塊がグレーの雲に変わる（別の雲は出さない） ===== */
const parcel=new THREE.Group();scene.add(parcel);
const cAir=new THREE.Color(0xcfe9ff),cAirEm=new THREE.Color(0x8fc4ee),cCloud=new THREE.Color(0xbfc6cf),cCloudEm=new THREE.Color(0x4c535c),cRain=new THREE.Color(0x8e97a3),cRainEm=new THREE.Color(0x2f353c),cRimAir=new THREE.Color(0x6fb2ea),cRimCloud=new THREE.Color(0x7d8794);
const blobMat=new THREE.MeshStandardMaterial({color:cAir,emissive:cAirEm,emissiveIntensity:0.4,roughness:0.6,transparent:true,opacity:0.2,depthWrite:false});
const rimMat=new THREE.MeshBasicMaterial({color:cRimAir,transparent:true,opacity:0.5,depthWrite:false,side:THREE.BackSide});   // ふちどり（透明なしゃぼん玉のように見せる）
const blobGeo=(()=>{const g=new THREE.IcosahedronGeometry(1,12);g.deleteAttribute('normal');g.deleteAttribute('uv');const m=mergeVertices(g);m.computeVertexNormals();return m;})();
const blobBase=blobGeo.attributes.position.array.slice();
const blob=new THREE.Mesh(blobGeo,blobMat),rimMesh=new THREE.Mesh(blobGeo,rimMat);
rimMesh.scale.setScalar(1.05);blob.renderOrder=5;rimMesh.renderOrder=4;blob.frustumCulled=false;rimMesh.frustumCulled=false;
parcel.add(rimMesh,blob);
function shapeBlob(t,ca){   // ゆるやかにゆれる塊。雲になるほど表面がもこもこする
  const pos=blobGeo.attributes.position,b=blobBase,n=pos.count;
  for(let i=0;i<n;i++){const x=b[i*3],y=b[i*3+1],z=b[i*3+2];
    const n1=Math.sin(1.7*x+0.9*y+t*0.5)*Math.cos(1.3*y-1.1*z+t*0.4);
    const n2=Math.sin(4.1*x+2.3*z+t*0.9)*Math.sin(3.7*y+1.9*x-t*0.7)+0.5*Math.sin(5.3*z+t*0.6);
    const rr=1+0.07*n1+ca*0.17*n2;
    pos.setXYZ(i,x*rr,y*rr,z*rr);}
  pos.needsUpdate=true;blobGeo.computeVertexNormals();
}
function parcelPos(r){   // 斜面にめりこまないよう、斜面の法線方向に少しはなして置く
  const pt=pathAt(S.p),off=r*1.05+0.3;
  const s=(terrainH(pt.x+0.15,ZP)-terrainH(pt.x-0.15,ZP))/0.3,n=Math.sqrt(1+s*s);
  return {x:pt.x-s/n*off,y:pt.h/100+off/n};
}

// 雨
const rain=new THREE.InstancedMesh(new THREE.BoxGeometry(0.13,1,0.13),new THREE.MeshBasicMaterial({color:0x2f6fe0}),CFG.rainDrops);
rain.instanceMatrix.setUsage(THREE.DynamicDrawUsage);rain.frustumCulled=false;scene.add(rain);
const drops=[];{const r=seeded(41);for(let i=0;i<CFG.rainDrops;i++)drops.push({u:r(),zz:r()*2-1,ph:r(),sp:0.9+r()*0.6});}
// 風：海から山へふく向きを、大きな矢印で見せる
const windArrows=[];
[[12.2,0.15],[15.7,0.6]].forEach(([y,ph])=>{
  const mat=new THREE.MeshBasicMaterial({color:0x3b86e0,transparent:true,opacity:0.9,depthWrite:false}),g=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,5,12),mat);shaft.rotation.z=-Math.PI/2;shaft.position.x=-1.0;
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.95,2,16),mat);head.rotation.z=-Math.PI/2;head.position.x=2.5;
  g.add(shaft,head);g.userData={y,ph,mat};scene.add(g);windArrows.push(g);
});

/* ===================== 音（Web Audio） ===================== */
let AC=null,rainGain=null,master=null;
function initAudio(){
  if(AC||!CFG.sound){if(AC&&AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();
    master=AC.createGain();master.gain.value=S.mute?0:1;master.connect(AC.destination);
    const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=2500;
    rainGain=AC.createGain();rainGain.gain.value=0;src.connect(f);f.connect(rainGain);rainGain.connect(master);src.start();
  }catch(e){AC=null;}
}
function tone(freq,dur,vol=0.15,type='sine',delay=0){
  if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
const sClick=()=>tone(660,0.08,0.1,'triangle');
const sCloud=()=>{tone(784,0.5,0.14);tone(1047,0.6,0.14,'sine',0.12);tone(1319,0.8,0.12,'sine',0.24);};

/* ===================== 画面まわり ===================== */
const R=(k,r)=>`<ruby>${k}<rt>${r}</rt></ruby>`;
function captionHTML(){
  switch(S.stage){
    case 0:return `${R('海','うみ')}の${R('上','うえ')}の${R('空気','くうき')}には、${R('目','め')}に${R('見','み')}えない${R('水蒸気','すいじょうき')}がたくさんあります。`;
    case 1:return `${R('風','かぜ')}で${R('山','やま')}にそって${R('上','あ')}がると、${R('空気','くうき')}はふくらんで、${R('温度','おんど')}が${R('下','さ')}がります。`;
    case 2:return `${R('冷','ひ')}えると${R('水蒸気','すいじょうき')}が${R('水','みず')}のつぶになり、${R('空気','くうき')}のかたまりが${R('雲','くも')}になります。`;
    case 3:return `${R('雲','くも')}のつぶが${R('大','おお')}きくなると、${R('雨','あめ')}になって${R('落','お')}ちてきます。`;
    default:return `${R('露点','ろてん')}まで${R('温度','おんど')}が${R('下','さ')}がらなかったので、${R('雲','くも')}はできなかった。`;
  }
}
function statusHTML(){
  if(S.stage===2)return `☁ ${R('雲','くも')}ができた！`;
  if(S.stage===3)return `🌧 ${R('雨','あめ')}がふっている`;
  return `☀ ${R('雲','くも')}はまだない`;
}
function tempCSS(T,a=1){const t=clamp(T/25,0,1);return `rgba(${Math.round(lerp(74,255,t))},${Math.round(lerp(163,130,t))},${Math.round(lerp(255,50,t))},${a})`;}
const thermoC=$('thermo');
function hidpi(c){const r=Math.min(window.devicePixelRatio||1,2),w=c.width,h=c.height;c.width=w*r;c.height=h*r;const g=c.getContext('2d');g.scale(r,r);c._w=w;c._h=h;return g;}
const gT=hidpi(thermoC);
function drawThermo(){
  const g=gT,w=thermoC._w,h=thermoC._h,x=w/2,y0=14,y1=h-44,tw=22;g.clearRect(0,0,w,h);
  const f=clamp((S.T+10)/40,0,1),yy=lerp(y1,y0,f);
  g.lineWidth=4;g.strokeStyle='#1c2b3a';g.fillStyle='#fff';
  g.beginPath();g.roundRect(x-tw/2,y0-8,tw,y1-y0+20,tw/2);g.fill();g.stroke();
  g.fillStyle=tempCSS(S.T);g.fillRect(x-tw/2+4,yy,tw-8,y1-yy+12);
  g.beginPath();g.arc(x,h-26,20,0,6.3);g.fill();g.stroke();
}
const cache={};
function setHTML(id,html){if(cache[id]!==html){cache[id]=html;$(id).innerHTML=html;}}
function syncUI(force){
  setHTML('caption',captionHTML());setHTML('status',statusHTML());
  const st=$('status');const cls=S.stage===2?'s2':S.stage===3?'s3':'';if(st.className!==cls)st.className=cls;
  const key=S.T.toFixed(1);
  if(force||cache.key!==key){cache.key=key;drawThermo();}
  setHTML('playBtn',S.mode==='play'?`⏸ ${R('止','と')}める`:`▶ ${R('自動','じどう')}`);
  const sc=$('scrub');if(!sc._drag){const v=String(Math.round(S.p*1000));if(sc.value!==v)sc.value=v;}
}

/* ===================== 毎フレームの更新 ===================== */
let prevStage=0;
function update(dt){
  if(S.paused)return;
  S.elapsed+=dt;S.frames++;
  if(S.mode==='play'){S.p+=dt/CFG.duration;if(S.p>=1){S.p=1;S.mode='idle';}}
  else if(S.mode==='step'){S.p+=dt/CFG.duration*CFG.stepSpeed;if(S.p>=S.targetP){S.p=S.targetP;S.mode='idle';}}
  derive();
  if(S.stage!==prevStage){if(S.stage===2&&prevStage<2)sCloud();if(S.stage===3&&prevStage===2)tone(392,0.4,0.1);prevStage=S.stage;}
  updateVisuals(dt);
}
function updateVisuals(dt){
  const t=S.elapsed,r=CFG.parcelR0*(1+CFG.parcelGrow*S.h/1000),pp=parcelPos(r),ca=S.cloudAmt,ra=S.rainAmt;
  parcel.position.set(pp.x,pp.y,ZP);
  // 色：うすい水色（透明）→ 雲ができ始めたらすぐグレーに → 雨のときはもっと濃いグレー（同じ塊のまま変わる）
  const cg=Math.pow(ca,0.6);
  blobMat.color.copy(cAir).lerp(cCloud,cg).lerp(cRain,ra);
  blobMat.emissive.copy(cAirEm).lerp(cCloudEm,cg).lerp(cRainEm,ra);
  blobMat.opacity=lerp(0.2,0.93,Math.pow(ca,0.8));
  rimMat.color.copy(cRimAir).lerp(cRimCloud,cg);rimMat.opacity=lerp(0.5,0,ca);
  shapeBlob(t,ca);
  const grow=1+0.12*ca;
  parcel.scale.set(r*1.12*grow,r*0.95*grow,r*grow);
  if(airLabel){airLabel.position.set(pp.x,pp.y+r*1.3+1.5,ZP);airLabel.visible=ca<0.35;}
  if(cloudLabel){cloudLabel.position.set(pp.x+r*1.7+2.2,pp.y+0.4,ZP);cloudLabel.visible=ca>=0.35;}
  // 雨：雲になった塊の下から落ちる
  const nR=Math.round(CFG.rainDrops*ra);
  if(nR>0||rain.count>0){
    for(let i=0;i<nR;i++){const d=drops[i],x=pp.x+(d.u-0.5)*r*2.1,z=ZP+d.zz*r*0.7,top=pp.y-r*0.45,bot=Math.min(terrainH(x,z),top-0.5),f=(t*d.sp+d.ph)%1;
      M4.compose(V3.set(x,lerp(top,bot,f),z),Q0,SC.set(1,1,1));rain.setMatrixAt(i,M4);}
    rain.count=nR;rain.instanceMatrix.needsUpdate=true;
  }
  if(rainGain&&AC)rainGain.gain.setTargetAtTime(0.1*ra,AC.currentTime,0.2);
  // 風の矢印（海から山のふもと・斜面の近くまで進んで、すうっと消える）
  windArrows.forEach(g=>{const u=g.userData,ph=(t*0.075+u.ph)%1;
    g.position.set(lerp(-41.5,-10,ph),u.y,5);u.mat.opacity=0.92*Math.min(1,Math.sin(Math.PI*ph)*2.2);});
}

/* ===================== 操作 ===================== */
function setP(p){S.p=clamp(p,0,1);S.mode='idle';derive();prevStage=S.stage;}
function play(){if(S.p>=0.999)S.p=0;S.mode='play';}
function pause(){S.mode='idle';}
function next(){const t=stepTargets().find(v=>v>S.p+0.004);if(t===undefined)return;S.targetP=t;S.mode='step';}
function reset(){setP(0);}
function setHumidity(v){S.humidity=clamp(v,20,95);recalcAir();derive();prevStage=S.stage;}
function setMountain(v){S.mountain=clamp(v,300,3000);rebuildTerrain();derive();prevStage=S.stage;}
function showHelp(v){S.paused=v;$('help').classList.toggle('hide',!v);if(rainGain&&AC&&v)rainGain.gain.setTargetAtTime(0,AC.currentTime,0.05);}

function bind(id,fn){$(id).addEventListener('click',e=>{initAudio();sClick();fn(e);});}
bind('resetBtn',reset);
bind('playBtn',()=>S.mode==='play'?pause():play());
bind('nextBtn',next);
bind('helpBtn',()=>showHelp(true));
bind('viewBtn',()=>{controls.reset();fitView();});
bind('muteBtn',()=>{S.mute=!S.mute;if(master)master.gain.value=S.mute?0:1;$('muteBtn').textContent=S.mute?'🔇':'🔊';});
bind('startBtn',()=>{S.started=true;showHelp(false);});
{const sc=$('scrub');
 sc.addEventListener('input',()=>{sc._drag=true;setP(sc.value/1000);});
 ['change','pointerup','touchend'].forEach(ev=>sc.addEventListener(ev,()=>{sc._drag=false;}));}

/* iPad対策：ダブルタップ拡大・ピンチ・スクロールを止める */
{let lastTap=0;
 document.addEventListener('touchend',e=>{const now=Date.now(),ui=e.target.closest&&e.target.closest('button,input');if(now-lastTap<300&&!ui)e.preventDefault();lastTap=now;},{passive:false});
 document.addEventListener('touchmove',e=>{const ok=e.target.closest&&e.target.closest('input[type=range],#helpCard');if(!ok)e.preventDefault();},{passive:false});
 ['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
 document.addEventListener('dblclick',e=>e.preventDefault());
 document.addEventListener('contextmenu',e=>e.preventDefault());}

/* ===================== 起動 ===================== */
$('ver').textContent=CFG.version;
recalcAir();rebuildTerrain();derive();
syncUI(true);fitView();updateVisualsSafe();
new ResizeObserver(()=>fitView()).observe(stageEl);
window.addEventListener('resize',fitView);
function updateVisualsSafe(){updateVisuals(0);syncUI(true);}
// フォントを待ってから3D内の文字を作る（読めなくても2.5秒で先へ進む）
Promise.race([document.fonts.load('700 56px "BIZ UDPGothic"','海風空気雲高'),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(()=>{buildLabels();updateVisualsSafe();fitView();});

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,1/30);last=now;   // 120Hzでも速さが変わらないよう、経過時間で動かす（1/30秒で上限）
  update(dt);controls.update();syncUI();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===================== テスト用フック =====================
   空気のかたまり（parcel）は .position ではなく S.p（経路上の進みぐあい 0〜1）で動かしている。
   位置・気温・雲の量などはすべて derive() が S.p から計算し、updateVisuals() が parcel.position に反映する。 */
window.__game={
  state:S,CFG,camera,scene,parcel,blob,
  api:{
    tick(n=1,dt=1/60){for(let i=0;i<n;i++)update(dt);syncUI(true);renderer.render(scene,camera);return this.info();},
    start(){S.started=true;showHelp(false);},
    setP(p){setP(p);updateVisuals(0);},
    setHumidity,setMountain,
    play,pause,next,reset,showHelp,stepTargets,pForH,sat,
    info(){return {p:S.p,mode:S.mode,x:S.x,h:S.h,T:S.T,rh:S.rh,cond:S.cond,cloudAmt:S.cloudAmt,rainAmt:S.rainAmt,stage:S.stage,base:S.base,dew:S.dew,frames:S.frames,elapsed:S.elapsed,paused:S.paused,parcel:parcel.position.toArray()};}
  }
};
